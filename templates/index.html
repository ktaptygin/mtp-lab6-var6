<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Лабораторная №6</title>
<style>
  body { max-width: 42rem; margin: 3rem auto; padding: 0 1rem; font: 17px system-ui; }
  section { margin: 2rem 0; }
  input, button { font: inherit; margin: .25rem 0; }
</style>
<h1>Формы Flask</h1>
{% if error %}<p role="alert">{{ error }}</p>{% endif %}
<section>
  <h2>Приветствие</h2>
  <form action="{{ url_for('greet') }}" method="post">
    <label>Имя <input name="name" required maxlength="80"></label>
    <button>Поздороваться</button>
  </form>
  {% if name %}<p>Привет, {{ name }}!</p>{% endif %}
</section>
<section>
  <h2>Загрузка файла</h2>
  <form action="{{ url_for('upload') }}" method="post" enctype="multipart/form-data">
    <label>Файл .txt <input name="file" type="file" accept=".txt" required></label>
    <button>Загрузить</button>
  </form>
  {% if uploaded %}<p>Файл «{{ uploaded }}» сохранён.</p>{% endif %}
</section>
</html>
